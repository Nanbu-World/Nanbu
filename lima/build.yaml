# Lima 构建 VM 配置（宿主机是 Ubuntu 也能跑，Lima 用 QEMU 提供 Arch 环境）
# 用法: limactl start ./lima/build.yaml --name=nanbu-build
# 然后: limactl shell nanbu-build   # 进 VM，在 /nanbu-linux 下 sudo ./build.sh

vmType: qemu
arch: x86_64

images:
- location: "https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2"
  arch: "x86_64"

mounts:
- location: "/home/xiangjian520/project/VM/nanbu-linux"
  mountPoint: "/nanbu-linux"
  writable: true

cpus: 4
memory: "8GiB"
disk: "40GiB"

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux
    pacman -Sy --noconfirm archiso calamares grub syslinux squashfs-tools \
      edk2-ovmf mtools dosfstools libisoburn

ssh:
  localPort: 60022

# 提示：若镜像 URL 失效，改用 `limactl start template://archlinux` 效果相同。