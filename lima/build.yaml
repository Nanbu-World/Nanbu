# Nanbu Linux —— Lima VM 参考配置（可选）
# 用法: limactl start ./lima/build.yaml
# 说明: Arch 下安装器的用法已由 Calamares 改为 archinstall。

images:
  - location: "https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2"
    arch: "x86_64"

provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      pacman -Sy --noconfirm
      pacman -S --noconfirm archinstall
      archinstall --config /dev/null --silent || true

probes:
  - script: |
      #!/usr/bin/env bash
      set -ex
      command -v archinstall >/dev/null 2>&1

mountType: 9p
mounts:
  - location: "~"
    writable: false