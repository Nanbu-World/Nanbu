#
# Nanbu Linux —— 构建与安装源（面向稳定，只开稳定仓库，不开 testing）
#

[options]
Architecture = auto

# 进度与校验
Color
CheckSpace
# 并行下载，加速构建
ParallelDownloads = 5

# 签名：要求数据库签名，可选本地文件签名
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# 默认不提取的文件（构建 ISO 时跳过，减小体积）
NoExtract = usr/share/help/* !usr/share/help/C/*

# 本地仓库占位：把发行版特色包放进这里再 repo-add
# [nanbu]
# SigLevel = Optional TrustAll
# Server = file:///opt/nanbu-repo/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 多架构库（x86_64 跑 32 位程序用，桌面发行版建议开）
[multilib]
Include = /etc/pacman.d/mirrorlist