# Nanbu Linux —— Calamares 顶层设置
# 基于 Calamares 默认 settings.conf，改动点：
#   1) show 阶段插入 netinstall（桌面选择页）
#   2) exec 阶段插入 packages（执行 netinstall 选中的包，pacman 后端）
#   3) exec 阶段插入 shellprocess（安装收尾：DM 交接 + 清理）
#   4) 移除 users 模块（默认用户 nanbu 已预置，见 customize_airootfs.sh）
#   5) branding 先用包自带 default（自定义见 README）
---
modules-search: [ local ]

# 调试/tracking 模块默认关闭，保持精简
instances: []

dont-chroot: false
oem-setup: false
disable-cancel-during-exec: false
quit-at-end: false

branding: default

prompt-install: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - netinstall
  - partition
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfs
  - bootloader
  - packages
  - netinstall
  - shellprocess
  - umount
- show:
  - finished